name: Build 健康生活 APK（Android原生语音）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Capacitor 8.5.2
        run: |
          npm install @capacitor/core@8.5.2 @capacitor/android@8.5.2
          npm install --save-dev @capacitor/cli@8.5.2

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Add microphone permission safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          head = s.split('>', 1)[0]
          if 'xmlns:android=' not in head:
              s = s.replace('<manifest', '<manifest xmlns:android="http://schemas.android.com/apk/res/android"', 1)
          perm = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if 'android.permission.RECORD_AUDIO' not in s:
              pos = s.find('>')
              s = s[:pos+1] + '\n    ' + perm + s[pos+1:]
          p.write_text(s, encoding='utf-8')
          PY
          sed -n '1,35p' android/app/src/main/AndroidManifest.xml

      - name: Install Android native voice bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/healthlife/app
          cat > android/app/src/main/java/com/healthlife/app/MainActivity.java <<'JAVA'
          package com.healthlife.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONObject;

          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_MIC = 7001;
              private AndroidVoiceBridge voiceBridge;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  voiceBridge = new AndroidVoiceBridge(this, getBridge().getWebView());
                  getBridge().getWebView().addJavascriptInterface(voiceBridge, "AndroidBridge");
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_MIC) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          voiceBridge.startListeningInternal();
                      } else {
                          voiceBridge.sendError("请允许“健康生活”使用麦克风");
                      }
                  }
              }

              public static class AndroidVoiceBridge {
                  private final Activity activity;
                  private final WebView webView;
                  private final Handler main = new Handler(Looper.getMainLooper());
                  private SpeechRecognizer recognizer;
                  private boolean listening = false;

                  AndroidVoiceBridge(Activity activity, WebView webView) {
                      this.activity = activity;
                      this.webView = webView;
                  }

                  @JavascriptInterface
                  public void startVoice() {
                      main.post(() -> {
                          if (listening) return;
                          if (activity.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              activity.requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_MIC);
                              return;
                          }
                          startListeningInternal();
                      });
                  }

                  @JavascriptInterface
                  public void stopVoice() {
                      main.post(this::stopListeningInternal);
                  }

                  void startListeningInternal() {
                      main.post(() -> {
                          if (listening) return;
                          if (!SpeechRecognizer.isRecognitionAvailable(activity)) {
                              sendError("此手机没有可用的 Android 系统语音识别服务");
                              return;
                          }
                          try {
                              cleanupRecognizer();
                              recognizer = SpeechRecognizer.createSpeechRecognizer(activity);
                              recognizer.setRecognitionListener(new RecognitionListener() {
                                  @Override public void onReadyForSpeech(Bundle params) { listening = true; sendState("started"); }
                                  @Override public void onBeginningOfSpeech() { }
                                  @Override public void onRmsChanged(float rmsdB) { }
                                  @Override public void onBufferReceived(byte[] buffer) { }
                                  @Override public void onEndOfSpeech() { listening = false; sendState("stopped"); }
                                  @Override public void onPartialResults(Bundle partialResults) { }
                                  @Override public void onEvent(int eventType, Bundle params) { }

                                  @Override public void onResults(Bundle results) {
                                      listening = false;
                                      ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                      String text = (matches != null && !matches.isEmpty()) ? matches.get(0) : "";
                                      sendResult(text);
                                      sendState("stopped");
                                      cleanupRecognizer();
                                  }

                                  @Override public void onError(int error) {
                                      listening = false;
                                      sendState("stopped");
                                      sendError(errorMessage(error));
                                      cleanupRecognizer();
                                  }
                              });

                              Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "zh-CN");
                              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "zh-CN");
                              intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
                              intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                              intent.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, activity.getPackageName());
                              intent.putExtra(RecognizerIntent.EXTRA_PROMPT, "请说出一笔消费，例如：午餐花了35元");
                              recognizer.startListening(intent);
                          } catch (Exception e) {
                              listening = false;
                              sendError("Android 原生语音启动失败，请检查麦克风权限");
                              cleanupRecognizer();
                          }
                      });
                  }

                  private void stopListeningInternal() {
                      if (recognizer != null) {
                          try { recognizer.stopListening(); } catch (Exception ignored) { }
                          try { recognizer.cancel(); } catch (Exception ignored) { }
                      }
                      listening = false;
                      sendState("stopped");
                      cleanupRecognizer();
                  }

                  private void cleanupRecognizer() {
                      if (recognizer != null) {
                          try { recognizer.cancel(); } catch (Exception ignored) { }
                          try { recognizer.destroy(); } catch (Exception ignored) { }
                          recognizer = null;
                      }
                  }

                  void sendResult(String text) {
                      runJS("window.onNativeSpeechResult(" + JSONObject.quote(text == null ? "" : text) + ");");
                  }

                  void sendError(String message) {
                      runJS("window.onNativeSpeechError(" + JSONObject.quote(message == null ? "语音识别失败" : message) + ");");
                  }

                  void sendState(String status) {
                      runJS("window.onNativeSpeechState(" + JSONObject.quote(status) + ");");
                  }

                  private void runJS(String js) {
                      webView.post(() -> webView.evaluateJavascript(js, null));
                  }

                  private String errorMessage(int error) {
                      switch (error) {
                          case SpeechRecognizer.ERROR_AUDIO: return "麦克风音频错误，请重试";
                          case SpeechRecognizer.ERROR_CLIENT: return "Android 语音识别客户端错误，请重试";
                          case SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS: return "没有麦克风权限";
                          case SpeechRecognizer.ERROR_NETWORK: return "语音识别网络错误，请检查网络";
                          case SpeechRecognizer.ERROR_NETWORK_TIMEOUT: return "语音识别网络超时";
                          case SpeechRecognizer.ERROR_NO_MATCH: return "没有听清，请再说一次";
                          case SpeechRecognizer.ERROR_RECOGNIZER_BUSY: return "语音识别正在使用，请稍后再试";
                          case SpeechRecognizer.ERROR_SERVER: return "Android 语音识别服务暂时不可用";
                          case SpeechRecognizer.ERROR_SPEECH_TIMEOUT: return "没有检测到说话，请再试一次";
                          default: return "Android 原生语音识别失败，请重试";
                      }
                  }
              }
          }
          JAVA
          sed -n '1,260p' android/app/src/main/java/com/healthlife/app/MainActivity.java

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 健康生活APP-Android-原生语音版
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

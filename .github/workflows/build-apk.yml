name: Build 健康生活 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor 8.5.2
        run: |
          npm install @capacitor/core@8.5.2 @capacitor/android@8.5.2
          npm install --save-dev @capacitor/cli@8.5.2

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.healthlife.app",
            "appName": "健康生活",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Add Android microphone permission safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          # Ensure android namespace is present on the manifest root.
          if 'xmlns:android=' not in s:
              s = s.replace('<manifest', '<manifest xmlns:android="http://schemas.android.com/apk/res/android"', 1)
          perm = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'android.permission.RECORD_AUDIO' not in s:
              end = s.find('>', s.find('<manifest'))
              s = s[:end+1] + '\n' + perm + s[end+1:]
          p.write_text(s, encoding='utf-8')
          PY
          sed -n '1,80p' android/app/src/main/AndroidManifest.xml

      - name: Install native Android bridge
        run: |
          mkdir -p android/app/src/main/java/com/healthlife/app
          cat > android/app/src/main/java/com/healthlife/app/MainActivity.java <<'JAVA'
          package com.healthlife.app;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_MIC = 7001;
              private AndroidBridge bridge;
              private boolean pendingVoice = false;

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  bridge = new AndroidBridge(this);
                  getBridge().getWebView().addJavascriptInterface(bridge, "AndroidBridge");
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_MIC) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED && pendingVoice) {
                          pendingVoice = false; bridge.startVoiceInternal();
                      } else { pendingVoice = false; bridge.sendError("请允许“健康生活”使用麦克风"); }
                  }
              }

              @Override protected void onDestroy() { if (bridge != null) bridge.destroy(); super.onDestroy(); }

              private static class AndroidBridge {
                  final MainActivity a; final WebView web; final SharedPreferences prefs; final Handler h = new Handler(Looper.getMainLooper());
                  SpeechRecognizer sr; boolean listening;
                  AndroidBridge(MainActivity a){ this.a=a; web=a.getBridge().getWebView(); prefs=a.getSharedPreferences("health_life_data", Context.MODE_PRIVATE); }
                  @JavascriptInterface public String load(String k){ return prefs.getString(k, null); }
                  @JavascriptInterface public void save(String k,String v){ prefs.edit().putString(k,v==null?"":v).apply(); }
                  @JavascriptInterface public void remove(String k){ prefs.edit().remove(k).apply(); }
                  @JavascriptInterface public void startVoice(){ h.post(() -> { if (a.checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED){ a.pendingVoice=true; a.requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO},REQ_MIC); } else startVoiceInternal(); }); }
                  @JavascriptInterface public void stopVoice(){ h.post(this::stopVoiceInternal); }
                  void startVoiceInternal(){
                      h.post(() -> {
                          if(listening) return;
                          if(!SpeechRecognizer.isRecognitionAvailable(a)){ sendError("此手机没有可用的系统语音识别服务"); return; }
                          try{
                              cleanup(); sr=SpeechRecognizer.createSpeechRecognizer(a);
                              sr.setRecognitionListener(new RecognitionListener(){
                                  public void onReadyForSpeech(Bundle b){listening=true; state("started");}
                                  public void onBeginningOfSpeech(){} public void onRmsChanged(float x){} public void onBufferReceived(byte[] b){} 
                                  public void onEndOfSpeech(){listening=false; state("stopped");}
                                  public void onPartialResults(Bundle b){} public void onEvent(int e,Bundle b){}
                                  public void onError(int e){listening=false; state("stopped"); sendError(msg(e)); cleanup();}
                                  public void onResults(Bundle b){listening=false; ArrayList<String> m=b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION); sendResult(m!=null&&!m.isEmpty()?m.get(0):""); state("stopped"); cleanup();}
                              });
                              Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH); i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM); i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"zh-CN"); i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS,1); i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS,false); i.putExtra(RecognizerIntent.EXTRA_PROMPT,"请说出一笔消费，例如：午餐花了35元"); sr.startListening(i);
                          }catch(Exception e){listening=false;sendError("麦克风启动失败，请检查系统权限");cleanup();}
                      });
                  }
                  void stopVoiceInternal(){h.post(()->{if(sr!=null){try{sr.stopListening();}catch(Exception e){} try{sr.cancel();}catch(Exception e){}} listening=false;state("stopped");cleanup();});}
                  void cleanup(){if(sr!=null){try{sr.cancel();}catch(Exception e){} try{sr.destroy();}catch(Exception e){} sr=null;}}
                  void destroy(){h.post(()->{listening=false;cleanup();});}
                  void sendResult(String t){js("window.onNativeSpeechResult("+JSONObject.quote(t==null?"":t)+");");}
                  void sendError(String t){js("window.onNativeSpeechError("+JSONObject.quote(t==null?"识别失败":t)+");");}
                  void state(String t){js("window.onNativeSpeechState("+JSONObject.quote(t)+");");}
                  void js(String s){web.post(()->web.evaluateJavascript(s,null));}
                  String msg(int e){switch(e){case SpeechRecognizer.ERROR_AUDIO:return "麦克风音频错误，请重试";case SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS:return "没有麦克风权限";case SpeechRecognizer.ERROR_NETWORK:return "语音识别网络错误，请检查网络";case SpeechRecognizer.ERROR_NETWORK_TIMEOUT:return "语音识别网络超时";case SpeechRecognizer.ERROR_NO_MATCH:return "没有听清，请再说一次";case SpeechRecognizer.ERROR_RECOGNIZER_BUSY:return "语音识别正在使用，请稍后再试";case SpeechRecognizer.ERROR_SPEECH_TIMEOUT:return "没有检测到说话，请再试一次";default:return "语音识别失败，请重试";}}
              }
          }
          JAVA

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android manifest and Gradle
        run: |
          grep -n 'RECORD_AUDIO\|xmlns:android' android/app/src/main/AndroidManifest.xml || true
          cat android/variables.gradle
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 健康生活APP-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
